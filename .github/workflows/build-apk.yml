name: Build APK

# Builds launcher/ into tvhome.apk on GitHub's runners (they ship the Android SDK), so you don't need
# Android tooling on your own computer. Download the APK from the run's "Artifacts" section.
on:
  push:
    paths:
      - "launcher/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "launcher/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      # Keep the signing key between runs, so a new build installs over the previous one
      # (otherwise run `adb uninstall com.mihir.tvhome` first).
      - uses: actions/cache@v4
        with:
          path: launcher/debug.keystore
          key: tvhome-debug-keystore-v1

      - name: Build
        run: bash launcher/build-and-install.sh --build

      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: launcher/build/tvhome.apk
          if-no-files-found: error

