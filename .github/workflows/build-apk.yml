name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the launcher folder
        id: find
        run: |
          echo "Repo contents:"; ls -la; echo
          SCRIPT=$(find . -type f -name build-and-install.sh -path '*launcher*' | head -n 1)
          if [ -z "$SCRIPT" ]; then
            echo "::error::launcher/build-and-install.sh is not in this repo. Upload the 'launcher' folder."
            exit 1
          fi
          echo "script=$SCRIPT" >> "$GITHUB_OUTPUT"
          echo "dir=$(dirname "$SCRIPT")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Build
        run: bash "${{ steps.find.outputs.script }}" --build

      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: ${{ steps.find.outputs.dir }}/build/tvhome.apk
          if-no-files-found: error
